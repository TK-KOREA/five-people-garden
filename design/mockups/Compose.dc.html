<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>D. 생각 나누기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#4E7A43}a:hover{color:#3B5F33}
input::placeholder,textarea::placeholder{color:#8C877D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #2B2A27; font-family: 'Noto Sans KR', sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <header style="padding: 16px 8px 8px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E6E0D6">
    <a href="Main.dc.html" aria-label="닫기" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B2A27" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <h1 style="margin: 0; font-size: 17px; font-weight: 700">생각 나누기</h1>
    <span style="width: 44px"></span>
  </header>

  <form style="flex: 1; overflow: hidden; padding: 20px 16px 0; display: flex; flex-direction: column; gap: 22px">
    <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
      <legend style="padding: 0; margin-bottom: 10px; font-size: 15px; font-weight: 700">어느 연결의 생각인가요?</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" aria-pressed="false" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #E6E0D6; background: #FFFFFF; color: #2B2A27; font: 400 14px 'Noto Sans KR', sans-serif">친구</button>
        <button type="button" aria-pressed="false" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #E6E0D6; background: #FFFFFF; color: #2B2A27; font: 400 14px 'Noto Sans KR', sans-serif">부모</button>
        <button type="button" aria-pressed="false" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #E6E0D6; background: #FFFFFF; color: #2B2A27; font: 400 14px 'Noto Sans KR', sans-serif">봉사</button>
        <button type="button" aria-pressed="false" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #E6E0D6; background: #FFFFFF; color: #2B2A27; font: 400 14px 'Noto Sans KR', sans-serif">다른 부모</button>
        <button type="button" aria-pressed="true" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #5B4878; background: #ECE6F2; color: #4A3A64; font: 700 14px 'Noto Sans KR', sans-serif">조부모</button>
      </div>
      <span style="font-size: 12px; color: #6B675F">여러 개를 골라도 돼요.</span>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="title" style="font-size: 15px; font-weight: 700">어떤 방안이 떠올랐나요?</label>
      <input id="title" placeholder="한 줄로 써 주세요" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1.5px solid #4E7A43; font: 400 16px 'Noto Sans KR', sans-serif; color: #2B2A27">
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="detail" style="font-size: 15px; font-weight: 700">조금 더 풀어 주세요 <span style="font-weight: 400; color: #6B675F">(선택)</span></label>
      <textarea id="detail" rows="3" placeholder="어떻게 하면 좋을지, 왜 떠올랐는지" style="box-sizing: border-box; resize: none; padding: 12px 14px; border-radius: 12px; border: 1px solid #E6E0D6; font: 400 15px/1.6 'Noto Sans KR', sans-serif; color: #2B2A27"></textarea>
    </div>

    <a href="#" aria-expanded="false" style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 14px; border-radius: 12px; background: #FAF7F2; color: #2B2A27; text-decoration: none; font-size: 14px">
      <span>더 적기 <span style="color: #6B675F">· 나이대, 상황, 근거 구절</span></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B675F" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg>
    </a>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="nick" style="font-size: 15px; font-weight: 700">어떻게 불러 드릴까요?</label>
      <input id="nick" value="연로한 형제" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #E6E0D6; font: 400 15px 'Noto Sans KR', sans-serif; color: #2B2A27">
      <span style="font-size: 12px; color: #6B675F; line-height: 1.5">이름이나 연락처 대신 학년이나 역할로 써 주세요. 이 기기에서는 다음에도 기억해요.</span>
    </div>
  </form>

  <div style="flex: none; padding: 12px 16px 28px; border-top: 1px solid #E6E0D6; display: flex; flex-direction: column; gap: 8px">
    <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #6B675F"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4E7A43" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>편집 코드 확인됨</span>
    <button type="submit" style="height: 52px; border-radius: 999px; border: none; background: #4E7A43; color: #FFFFFF; font: 700 16px 'Noto Sans KR', sans-serif">나누기</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
